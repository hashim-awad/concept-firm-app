# ONE-OFF, TEST ONLY: creates the dummy owner login on the TEST Supabase project so Hashim can sign in to
# previews (Hashim, Nov 15, 2026). Removed from the branch right after it runs; never merged to main.
# Only the bcrypt hash of the test password is here; the password is never in the repo or the log.
name: Test - dummy owner login

on:
  push:
    branches: [claude/bank-pdf-round20]
    paths:
      - ".github/workflows/test-dummy-owner.yml"

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    environment: test
    env:
      PROJECT_ID: wtivdpwyoarpcbgohgnr # Concept Firm App - Test (ca-central-1). Never the Live project.
      POOLER_HOST: aws-1-ca-central-1.pooler.supabase.com
    steps:
      - uses: actions/checkout@v5
      - name: Build database address (password stays masked)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          ENCODED=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
          echo "::add-mask::$ENCODED"
          DB_URL="postgresql://postgres.${PROJECT_ID}:${ENCODED}@${POOLER_HOST}:5432/postgres"
          echo "::add-mask::$DB_URL"
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"
      - name: Create or reset the dummy owner (Test only)
        run: |
          test "$PROJECT_ID" = "wtivdpwyoarpcbgohgnr"
          psql "$DB_URL" -v email=owner.dummy@example.test -v full_name="Dummy Owner" \
            -v pw_hash='$2a$10$HH2gNgaD.0iyCR8XLjxiF.eP.0wCNGQOnSkpcD7EYOKVE2wWVivPG' \
            -f scripts/test-only/create-dummy-owner.sql
