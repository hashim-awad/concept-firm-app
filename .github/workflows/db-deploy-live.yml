# Applies database changes (supabase/migrations) to the LIVE Supabase project.
# Runs only from main: on a push to main that changes a migration, or by hand from the Actions
# tab ("Run workflow"). Every run waits for an owner's approval in GitHub (the "production"
# environment has Hashim as required reviewer), then shows the changes before applying them.
#
# Connects through Supabase's session pooler (IPv4), because GitHub's machines cannot reach
# the direct database address (IPv6 only).
#
# Secret lives in GitHub, never in this file:
#   - SUPABASE_DB_PASSWORD   (secret in the "production" environment: the LIVE database password)
name: Database deploy - Live

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-deploy-live.yml"
  workflow_dispatch:
    inputs:
      drop_backup:
        description: "Only remove this backup (deploy_backup_YYYYMMDD_HHMMSS), after Hashim confirms. Leave blank to deploy."
        required: false
        default: ""

concurrency:
  group: db-deploy-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_ID: owysxewnrnvrcpjutxcw # Concept Firm App (Live, ca-central-1)
      POOLER_HOST: aws-1-ca-central-1.pooler.supabase.com
      STUDIO_URL: https://studio.conceptaccounting.ca
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Build database address (password stays masked)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          ENCODED=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
          echo "::add-mask::$ENCODED"
          DB_URL="postgresql://postgres.${PROJECT_ID}:${ENCODED}@${POOLER_HOST}:5432/postgres"
          echo "::add-mask::$DB_URL"
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"
      # Reversible deploy (scripts/deploy/db-deploy.sh), rehearsed on Test before every merge:
      #   BACKUP  a dated copy of every table (deploy_backup_YYYYMMDD_HHMMSS), before any change
      #   CHANGE  the migrations, shown first
      #   CHECK   the account links check; must be 0 rows
      #   RESTORE if the check is not 0 or anything fails: every changed table put back from the backup in
      #           this run, proved row for row, and the run stops red
      #   FILES CHANGED  a count and a Studio link to each file the change touched (file ids, no names)
      # The backup is kept until Hashim confirms; then run this workflow by hand with drop_backup.
      - name: Deploy (backup, change, check, restore if needed, files changed)
        if: inputs.drop_backup == ''
        env: { DEPLOY_ENV: live }
        run: bash scripts/deploy/db-deploy.sh
      - name: Remove one backup
        if: inputs.drop_backup != ''
        env: { BK: "${{ inputs.drop_backup }}" }
        run: bash scripts/deploy/drop-backup.sh
