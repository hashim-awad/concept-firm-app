# Applies database changes (supabase/migrations) to the LIVE Supabase project.
# Runs only from main: on a push to main that changes a migration, or by hand from the Actions
# tab ("Run workflow"). Every run waits for an owner's approval in GitHub (the "production"
# environment has Hashim as required reviewer), then shows the changes before applying them.
#
# Connects through Supabase's session pooler (IPv4), because GitHub's machines cannot reach
# the direct database address (IPv6 only).
#
# Secret lives in GitHub, never in this file:
#   - SUPABASE_DB_PASSWORD   (secret in the "production" environment: the LIVE database password)
name: Database deploy - Live

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-deploy-live.yml"
  workflow_dispatch:

concurrency:
  group: db-deploy-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_ID: owysxewnrnvrcpjutxcw # Concept Firm App (Live, ca-central-1)
      POOLER_HOST: aws-1-ca-central-1.pooler.supabase.com
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Build database address (password stays masked)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          ENCODED=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
          echo "::add-mask::$ENCODED"
          DB_URL="postgresql://postgres.${PROJECT_ID}:${ENCODED}@${POOLER_HOST}:5432/postgres"
          echo "::add-mask::$DB_URL"
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"
      # Read-only account links check (scripts/checks/account-links-check.sql): file ids and counts only.
      # Clean = "(0 rows)". Run before and after the change, so each deploy reports what it fixed.
      - name: Account links check, before
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -P pager=off -f scripts/checks/account-links-check.sql
      - name: Show changes that will be applied
        run: supabase db push --remote="$DB_URL" --dry-run
      - name: Apply changes
        run: supabase db push --remote="$DB_URL" --yes
      - name: Account links check, after
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -P pager=off -f scripts/checks/account-links-check.sql
