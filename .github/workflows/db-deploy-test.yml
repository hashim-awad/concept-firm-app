# Applies database changes (supabase/migrations) to the TEST Supabase project.
# Runs on every push to a branch other than main that changes a migration,
# or by hand from the Actions tab ("Run workflow").
# Secrets live in GitHub, never in this file:
#   - SUPABASE_ACCESS_TOKEN  (repository secret)
#   - SUPABASE_DB_PASSWORD   (secret in the "test" environment)
name: Database deploy - Test

on:
  push:
    branches-ignore: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-deploy-test.yml"
  workflow_dispatch:

concurrency:
  group: db-deploy-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: wtivdpwyoarpcbgohgnr # Concept Firm App - Test (ca-central-1)
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Link to the Test project
        run: supabase link --project-ref "$PROJECT_ID"
      - name: Show changes that will be applied
        run: supabase db push --remote --dry-run
      - name: Apply changes
        run: supabase db push --remote
