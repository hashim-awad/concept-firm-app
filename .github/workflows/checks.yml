# Runs on every push: database tests on a throwaway Postgres, then lint and build.
# Uses no secrets and touches no Supabase project.
name: Checks

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - run: supabase/tests/run_local.sh

  app:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Placeholders so the build can run. Real values live only in Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
      SUPABASE_SECRET_KEY: placeholder
      SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src
      - run: npm test
      - run: npx next build

  studio-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Engine copy matches the Studio reference file
        run: npm run studio:extract && git diff --exit-code src/lib/studio/engine.generated.js src/lib/studio/wording.generated.json
      # GitHub's machines already hold the browser's system libraries. If Ubuntu's package servers do
      # not answer within 3 minutes (seen Nov 11, 2026), install only the browser, which comes from
      # Playwright's own servers. The tests themselves are unchanged.
      - run: timeout 180 npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Parity with the original Studio page
        run: npm run test:parity
      - name: Build the app for the screen test (placeholders, no database)
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          SUPABASE_SECRET_KEY: placeholder
          SITE_URL: http://localhost:3000
      - name: App screens filled like Studio's forms give identical output
        run: npm run test:screens
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          SUPABASE_SECRET_KEY: placeholder
          SITE_URL: http://localhost:3000
