# Runs on every push (so on every PR): database tests on a throwaway Postgres; lint, type check, unit tests and build;
# the answer keys on a throwaway local Supabase; and the name check (docs/CLOSEBOOK2.md rule 16: no agent runs tests).
# Touches no Supabase project. One secret, CLIENT_NAMES, is passed only to the name check step (never printed).
name: Checks

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every new migration must sort after the last one on main (what Live has), so the Live deploy never
  # refuses or skips one (scripts/checks/migration-order.sh).
  migration-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: bash scripts/checks/migration-order.sh

  # Piece 10b: no business number that passes CRA's check digit, and no client name, in the files this branch changes or
  # its commit messages (scripts/checks/name-check.sh). A hit names the file and line, never the value. Runs no npm code.
  name-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Name check
        env:
          CLIENT_NAMES: ${{ secrets.CLIENT_NAMES }}
        run: bash scripts/checks/name-check.sh

  database-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - run: supabase/tests/run_local.sh

  app:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Placeholders so the build can run. Real values live only in Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
      SUPABASE_SECRET_KEY: placeholder
      SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src
      - run: npx next typegen && npx tsc --noEmit -p .
      - run: npm test
      - run: npx next build

  # CB2-0 v7 item 9: every answer key (tests/answer-keys) on this branch's engine, with the bug checks (balance sheet
  # balances, statement net income equals the trial balance's). Dummy and disguised data only; a throwaway local Supabase.
  answer-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Local Supabase with this branch's migrations and the dummy owner
        run: bash scripts/ci/local-supabase.sh
      - name: Answer keys
        run: ANSWER_KEYS_DB_URL="$LOCAL_DB_URL" npm run answer-keys

  studio-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Engine copy matches the Studio reference file
        run: npm run studio:extract && git diff --exit-code src/lib/studio/engine.generated.js src/lib/studio/wording.generated.json
      # GitHub's machines already hold the browser's system libraries. If Ubuntu's package servers do
      # not answer within 3 minutes (seen Nov 11, 2026), install only the browser, which comes from
      # Playwright's own servers. The tests themselves are unchanged.
      - run: timeout 180 npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Parity with the original Studio page
        run: npm run test:parity
      - name: Build the app for the screen test (placeholders, no database)
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          SUPABASE_SECRET_KEY: placeholder
          SITE_URL: http://localhost:3000
      - name: App screens filled like Studio's forms give identical output
        run: npm run test:screens
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          SUPABASE_SECRET_KEY: placeholder
          SITE_URL: http://localhost:3000
