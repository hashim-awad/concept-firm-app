<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concept Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{--bg:#f2f4f8;--panel:#fff;--ink:#18202e;--muted:#5d6678;--line:#dde2ec;--navy:#1A3C7C;--navy2:#0f2550;--green:#86BC26;--accent:#1A3C7C;--err:#b3261e;--errbg:#fbeceb;--warn:#8a5a00;--warnbg:#fff4dc;--okbg:#eaf5dc;--ok:#3d6b0c;--field:#fff;--chip:#eef1f7;
--side:#0f2550;--sideInk:#d8e1f3;--sideMuted:#8ea0c4;--sideActive:#86BC26;--sideActiveInk:#0c1a33;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e131c;--panel:#171e2a;--ink:#e6e9ef;--muted:#9aa3b5;--line:#283244;--accent:#8fb0ee;--err:#ff8a80;--errbg:#3a1d1b;--warn:#ffcc66;--warnbg:#3a2f15;--okbg:#22301a;--ok:#b7e07a;--field:#111823;--chip:#202a3a;--side:#0a1630;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e131c;--panel:#171e2a;--ink:#e6e9ef;--muted:#9aa3b5;--line:#283244;--accent:#8fb0ee;--err:#ff8a80;--errbg:#3a1d1b;--warn:#ffcc66;--warnbg:#3a2f15;--okbg:#22301a;--ok:#b7e07a;--field:#111823;--chip:#202a3a;--side:#0a1630;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Poppins,"Segoe UI",Arial,sans-serif;font-size:14px}
.app{display:grid;grid-template-columns:248px 1fr;height:100%}
.side{background:var(--side);color:var(--sideInk);display:flex;flex-direction:column;overflow-y:auto;background-image:linear-gradient(180deg,rgba(134,188,38,.07),transparent 40%),repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 28px),repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 28px)}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px}
.brand .mark{width:34px;height:34px;border-radius:8px;background:#fff;display:grid;place-items:center;color:var(--navy);font-weight:700;font-size:19px;position:relative}
.brand .mark::after{content:"";position:absolute;right:5px;top:9px;width:7px;height:7px;border-top:3px solid var(--green);border-right:3px solid var(--green);transform:rotate(45deg)}
.brand b{display:block;font-size:15px;color:#fff;letter-spacing:.2px}
.brand span{font-size:11.5px;color:var(--sideMuted)}
.nav{padding:4px 10px 14px;flex:1}
.nav .grp{font-size:11.5px;color:var(--sideMuted);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:2px 0;border-radius:8px;color:var(--sideInk);text-decoration:none;font-size:13.5px;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:var(--sideActive);color:var(--sideActiveInk);font-weight:600}
.nav a.navpar.act{color:#fff;font-weight:600}nav a .soon{margin-left:auto;font-size:10.5px;padding:2px 7px;border-radius:20px;background:rgba(255,255,255,.1);color:var(--sideMuted)}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side .foot{padding:12px 18px 18px;font-size:11.5px;color:var(--sideMuted);border-top:1px solid rgba(255,255,255,.08)}
.main{overflow-y:auto;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 26px;background:var(--bg);border-bottom:1px solid var(--line)}
.top .date,.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:var(--panel);font-size:12.5px;color:var(--muted)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#aab}
.pill.ok .dot{background:var(--green)}.pill.bad .dot{background:var(--err)}.pill.wait .dot{background:#e0a400}
.top .sp{flex:1}
.menuBtn{display:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.hero{background:var(--navy2);color:#fff;padding:34px 30px 30px;background-image:linear-gradient(120deg,rgba(26,60,124,.9),rgba(15,37,80,.95) 60%,rgba(134,188,38,.35)),repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 32px),repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 32px)}
.hero .eb{font-size:12px;color:#b9d77f;letter-spacing:.6px}
.hero h1{font-size:34px;font-weight:600;margin:6px 0 6px;letter-spacing:-.4px}
.hero p{margin:0;color:#cdd7ea;max-width:640px;line-height:1.55}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-top:22px;border:1px solid rgba(255,255,255,.18);border-radius:12px;background:rgba(255,255,255,.06);max-width:980px}
.stats div{padding:14px 18px;border-right:1px solid rgba(255,255,255,.12)}
.stats div:last-child{border-right:0}
.stats small{display:block;color:#b8c4dc;font-size:12px}
.stats b{font-size:26px;font-weight:600}
.page{padding:22px 26px 50px;max-width:1400px;width:100%}
.ph{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:4px 0 16px}
.ph h2{margin:0;font-size:22px;color:var(--accent);font-weight:600}
.ph .sub{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.panel h3{margin:0 0 10px;font-size:14.5px;font-weight:600}
.item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.45}
.item:first-of-type{border-top:0}
.tag{flex:none;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--chip);color:var(--muted)}
.tag.err{background:var(--errbg);color:var(--err)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.ok{background:var(--okbg);color:var(--ok)}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.tablewrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:hover td{background:var(--chip)}
a.lnk,button.lnk{color:var(--accent);text-decoration:none;background:none;border:0;padding:0;font:inherit;cursor:pointer}
a.lnk:hover,button.lnk:hover{text-decoration:underline}
input[type=text],input[type=date],input[type=month],input[type=search],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font:inherit;font-size:13.5px}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:8px;align-items:flex-start;margin:10px 0 0;color:var(--ink);font-size:13px}
.chk input{margin-top:3px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.hidden{display:none!important}
.btn{font:inherit;font-weight:600;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.status{font-size:12.5px;color:var(--muted);margin-left:8px}
.elgrid{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:18px}
.checks{list-style:none;margin:0;padding:0}
.checks li{padding:8px 10px;border-radius:8px;margin-bottom:6px;font-size:12.5px;line-height:1.4}
.checks .err{background:var(--errbg);color:var(--err)}
.chksum{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;width:100%;margin-bottom:6px}
.chksum.err{background:var(--errbg);color:var(--err)}.chksum.warn{background:var(--warnbg);color:var(--warn)}.chksum.ok{background:var(--okbg);color:var(--ok);cursor:default}.checks .warn{background:var(--warnbg);color:var(--warn)}.checks .ok{background:var(--okbg);color:var(--ok)}
.sticky{position:sticky;top:62px;z-index:5}
.paperwrap{overflow-x:auto}
.paper{background:#fff;color:#1d2330;max-width:816px;margin:0 auto;padding:44px 56px;border-radius:4px;box-shadow:0 2px 14px rgba(0,0,0,.12);font-family:Roboto,Arial,sans-serif;font-size:13px;line-height:1.5;position:relative}
.paper.draft::after{content:"DRAFT FOR REVIEW";position:absolute;top:220px;left:0;right:0;text-align:center;font-size:58px;font-weight:700;color:rgba(179,38,30,.09);transform:rotate(-30deg);pointer-events:none}
.paper img.lh{width:100%;margin-bottom:18px}
.paper p{margin:0 0 9px;text-align:justify}.paper li{text-align:justify}.paper h3{color:#1A3C7C;font-size:14px;margin:14px 0 6px}
.paper ul{margin:0 0 9px 18px;padding:0}
.paper table{border-collapse:collapse;width:100%;margin:4px 0 10px}
.paper th{background:#1A3C7C;color:#fff;text-align:left;padding:5px 8px}
.paper td{border:1px solid #c9d3e6;padding:5px 8px;vertical-align:top}
.paper .pgb{border-top:2px dashed #c9d3e6;margin:26px -56px 22px;position:relative}
.paper .pgb span{position:absolute;top:-10px;left:56px;background:#fff;padding:0 6px;font-size:11px;color:#7a8394}
.paper .sig{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:8px}
.paper .sig .ln{border-top:1px solid #333;margin-top:30px;padding-top:3px}
.paper .tc p{font-size:12px}
.paper .app-r{text-align:right;margin-top:22px}
.paper .missing{background:#fbeceb;color:#b3261e;padding:0 3px;border-radius:3px}
.paper .illus{position:relative;overflow:hidden}
.paper .illus::after{content:"ILLUSTRATIVE ONLY";position:absolute;top:45%;left:-10%;right:-10%;text-align:center;font-size:54px;font-weight:700;color:rgba(179,38,30,.17);transform:rotate(38deg);pointer-events:none}
.paper .illus .ban{background:#b3261e;color:#fff;font-weight:700;text-align:center;padding:6px 10px;font-size:12px;margin-bottom:10px}
.modal{position:fixed;inset:0;z-index:100;background:rgba(8,14,28,.55);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(30px,env(safe-area-inset-top,0px)) 14px 30px}
.modal .box{background:var(--panel);color:var(--ink);border-radius:14px;width:100%;max-width:620px;padding:20px 22px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.modal h3{margin:0 0 4px;font-size:17px;color:var(--accent)}
.modal .sub{color:var(--muted);font-size:12.5px;margin-bottom:8px}
.modal .acts{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.soonbox{max-width:640px}
.soonbox p{color:var(--muted);line-height:1.6}
.banner{padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13px;line-height:1.5}
.banner.warn{background:var(--warnbg);color:var(--warn)}.banner.err{background:var(--errbg);color:var(--err)}.banner.ok{background:var(--okbg);color:var(--ok)}


.stepper{display:flex;align-items:flex-start;justify-content:space-between;position:relative;padding:14px 18px 12px;background:var(--card,#fff);border:1px solid var(--line);border-top:4px solid #1A3C7C;border-radius:12px;margin-bottom:12px}
.stepper .st{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;cursor:pointer;background:none;border:0;font:inherit;color:var(--muted);padding:0}
.stepper .st:not(:last-child)::after{content:"";position:absolute;top:15px;left:calc(50% + 18px);right:calc(-50% + 18px);height:3px;background:var(--line);border-radius:2px}
.stepper .st.done:not(:last-child)::after{background:#86BC26}
.stepper .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--line);color:#fff;border:2px solid transparent;position:relative;z-index:1}
.stepper .st.done .dot{background:#86BC26}
.stepper .st.cur .dot{background:#fff;color:#1A3C7C;border-color:#1A3C7C}
.stepper .st.cur .lab{color:var(--ink);font-weight:600}
.stepper .lab{font-size:12.5px}
.stepbody>.panel{margin-bottom:0}
.stepnav{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}
.stepnav .pos{font-size:12px;color:var(--muted)}
@media (min-width:901px){ .elgrid>div:first-child.stepped{display:block;padding-top:0} .elgrid>div:first-child.stepped .stepper{position:sticky;top:0;z-index:3} }
@media (min-width:901px){
 .elgrid{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:var(--top,40%) 12px minmax(0,1fr);height:calc(100vh - 170px);gap:0}
 .elgrid>div:first-child{overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;align-content:start;padding:2px 6px 8px 2px}
 .elgrid>div:first-child>.panel,.elgrid>div:first-child>div>.panel{margin-bottom:0}
 .elgrid>div:first-child>#p_opts{display:contents}
 .elgrid>.splitbar{cursor:row-resize;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none}
 .elgrid>.splitbar::before{content:"";width:64px;height:5px;border-radius:4px;background:var(--line)}
 .elgrid>.splitbar:hover::before{background:var(--accent)}
 .elgrid>div:last-child{min-height:0;display:flex;flex-direction:column;gap:8px}
 .elgrid>div:last-child>.panel.sticky{position:static;margin-bottom:0;padding:10px 14px}
 .page:has(.elgrid){max-width:none}
 .elgrid>div:first-child>.feepanel,.elgrid>div:first-child>#p_opts>.panel{grid-column:span 2}
 .elgrid>div:last-child>.panel.sticky{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
 .elgrid>div:last-child>.panel.sticky>div{margin-top:0!important}
 .elgrid>div:last-child>.panel.sticky>.chksum{flex:1 1 320px;width:auto;margin:0}
 .elgrid>div:last-child>.panel.sticky>.checks{flex-basis:100%;order:9;max-height:140px;overflow:auto;margin:0}
 .elgrid>div:last-child>.panel.sticky>#acks:empty{display:none}
 .elgrid .checks li{padding:5px 9px;margin-bottom:4px}
 .elgrid>div:last-child>.panel.sticky>.chk{margin-top:0!important}
 .elgrid>div:last-child>.paperwrap{order:1}
 .elgrid>div:last-child>.panel.sticky{order:2;border-top:2px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.05)}
 .page:has(.elgrid){padding-top:12px;padding-bottom:12px}
 .page:has(.elgrid) .ph{margin:0 0 10px}
 .elgrid{height:calc(100vh - 128px)}
 .elgrid .paperwrap{flex:1;min-height:0;overflow:auto;padding:4px 0 20px}
}
@media (max-width:1100px){.elgrid{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){.top .date{display:none}.feeline{grid-template-columns:1fr 1fr!important}.feeline>input:first-child{grid-column:1 / -1}}
@media (max-width:820px){.app{grid-template-columns:1fr}.side{position:fixed;inset:0 auto 0 0;width:260px;z-index:50;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}.side.open{transform:none}.menuBtn{display:inline-block}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.page,.top{padding-left:14px;padding-right:14px}.hero{padding:26px 16px}.hero h1{font-size:28px}}

@media (min-width:1400px){
 .elgrid{grid-template-columns:var(--left,34%) 14px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
 .elgrid>.splitbar{cursor:col-resize}
 .elgrid>.splitbar::before{width:5px;height:64px}
 .elgrid>div:first-child.stepped{padding-right:4px}
 .elgrid>div:first-child>.feepanel,.elgrid>div:first-child>#p_opts>.panel{grid-column:auto}
}

.pvbar{display:flex;align-items:center;gap:6px;justify-content:flex-end;padding:0 4px 6px;order:0}
.pvbar button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--card,#fff);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer;min-width:34px}
.pvbar button:hover{border-color:var(--accent)}
.pvbar .zv{font-size:12.5px;color:var(--muted);min-width:44px;text-align:center}
.pvbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.paper{width:816px;max-width:none}
@media (min-width:1400px){ .elgrid.focus{grid-template-columns:minmax(0,1fr)!important} .elgrid.focus>div:first-child,.elgrid.focus>.splitbar{display:none} }
@media (max-width:1399px){ .elgrid.focus{grid-template-rows:minmax(0,1fr)!important} .elgrid.focus>div:first-child,.elgrid.focus>.splitbar{display:none} }
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side">
 <div class="brand" style="flex-direction:column;align-items:flex-start;gap:8px;padding:22px 18px 14px"><img src="sidebar-logo.png" alt="Concept Studio" style="width:170px;height:auto;display:block"><span style="font-size:11.5px;color:var(--sideMuted)">Controlled client documents</span></div>
 <nav class="nav" id="nav"></nav>
 <div class="foot" id="sideFoot"></div>
</aside>
<div class="main" id="main">
 <div class="top">
  <button class="menuBtn" id="menuBtn" aria-label="Menu">Menu</button>
  <span class="date" id="today"></span>
  <span class="sp"></span>
  <span class="pill wait" id="notionPill"><span class="dot"></span><span id="notionTxt">Connecting to Notion</span></span>
  <button class="btn sec" id="refreshBtn" style="padding:6px 12px;font-size:12.5px">Refresh</button>
 </div>
 <div id="view"></div>
</div>
</div>
<script>

var EL_VERSION = "EL v3.31";
var EL_VERSION_DATE = "2026-10-29";
var FIRM_ADDR = "675 Riverbend Dr., Kitchener, Ontario  N2K 3S3";
var FIRM = "Concept Accounting & Advisory Professional Corporation";
var SIGNER = "Hashim Abouelfetouh, CPA";
var SIGNER_TITLE = "Director";

var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function parseD(s){ if(!s) return null; var p=s.split("-"); if(p.length<3) return null; var d=new Date(+p[0],+p[1]-1,+p[2]); return isNaN(d)?null:d; }
function fmtD(s){ var d=parseD(s); return d? MONTHS[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear() : ""; }
function fmtMonth(s){ if(!s) return ""; var p=s.split("-"); return MONTHS[+p[1]-1]+" "+p[0]; }
function money(v){ var n=Number(String(v).replace(/[^0-9.]/g,"")); if(!isFinite(n)||String(v).trim()==="") return ""; return "$"+n.toLocaleString("en-CA",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2}); }
function feeVal(v){ v=String(v==null?"":v).trim(); if(!v) return {k:"blank"}; if(/^incl/i.test(v)) return {k:"incl"}; var n=Number(v.replace(/[$,\s]/g,"")); if(isFinite(n)&&n>0) return {k:"num",n:n}; return {k:"bad"}; }
function feeText(v){ var f=feeVal(v); if(f.k==="num") return money(f.n)+" plus GST/HST"; if(f.k==="incl") return "Included"; return ""; }
function trim(v){ return (v||"").replace(/\s+/g," ").trim(); }

var BASIS = {
  standard: "The compiled financial information will be prepared on the historical cost basis. It will reflect cash transactions, with the addition of the accruals that apply to the Company, such as accounts receivable, accounts payable and accrued liabilities, amortization of capital assets, and income taxes payable. It will not apply all the recognition, measurement, presentation and disclosure requirements of Canadian accounting standards for private enterprises (ASPE).",
  cash: "The compiled financial information will be prepared on the cash basis. Revenue is recorded when cash is received and expenses are recorded when cash is paid. It will not apply the requirements of Canadian accounting standards for private enterprises (ASPE)."
};

var TYPES = {
  ye:  {label:"Year-end: compiled financial statements and T2", short:"Year-End Compilation and T2", comp:true},
  mfs: {label:"Monthly full service: bookkeeping, GST/HST, compiled financial statements and T2", short:"Monthly Full Service", comp:true},
  t2:  {label:"T2 only: corporate tax return, no compiled financial statements", short:"Corporate Tax Return (T2)", comp:false},
  svc: {label:"Corporate services", short:"Corporate Services", comp:false}
};

function periodInfo(s){
  var ye=parseD(s.ye), ld=parseD(s.letterDate);

  var isPeriod = !!(s.firstYear && s.periodStart);

  return {tense:tense, isPeriod:isPeriod, unit:isPeriod?"period":"year", phrase:phrase, yeTxt:fmtD(s.ye)};
}

function statementsList(s){
  var P=periodInfo(s);

}

function errMsg(e){ var c=e&&e.code; var base = c==="tool_error" ? ERRTXT.tool_error+String(e.message||"").slice(0,300) : (ERRTXT[c]||"Notion connection problem."); return base+" [Code: "+(c||"unknown")+(c!=="tool_error"&&e&&e.message?" \u00b7 "+String(e.message).slice(0,200):"")+"]"; }
function setPill(state,txt){ var p=$("notionPill"); p.className="pill "+state; $("notionTxt").textContent=txt; }
async function queryRows(ds){
 var view = VIEWMAP[ds];
 var all=[], cursor=null, guard=0;
 do{
  var input={data:{mode:"view",view_url:view,page_size:100}}; if(cursor) input.data.start_cursor=cursor;
  var r=await mcp.callTool("Notion","notion-query-data-sources",input,{cache:false});
  var p=r.payload; if(typeof p==="string"){ try{p=JSON.parse(p);}catch(e){ throw {code:"bad_reply",message:String(p).slice(0,200)}; } }
  if(!p||!Array.isArray(p.results)) throw {code:"bad_reply",message:String(JSON.stringify(p)||"").slice(0,200)};
  all=all.concat(p.results); cursor=p.has_more?p.next_cursor:null; guard++;
 }while(cursor && guard<20);
 return {rows:all, more:!!cursor};
}
function rel(v){ if(!v) return []; if(Array.isArray(v)) return v; try{ var a=JSON.parse(v); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function idOf(u){ var m=String(u||"").match(/([0-9a-f]{32})/i); return m?m[1].toLowerCase():String(u||""); }
async function loadData(isRetry){
 if(!mcp){ setPill("bad", standalone?"Offline copy: Notion not available":"Notion not available in this view"); DB.loaded=false; refreshAll(); return; }
 setPill("wait","Loading Notion records");
 try{
  var a=await queryRows(DS_CLIENTS), b=await queryRows(DS_ENG), q=await queryRows(DS_QL);
  DB.ql=q.rows.filter(function(r){return trim(r["Item"]);});
  try{ var pp=await queryRows(DS_PROP); DB.props=pp.rows.filter(function(r){return trim(r["Proposal"]);}); }catch(e){ DB.props=[]; }
  try{ var cc=await queryRows(DS_CAT); DB.cat=cc.rows.filter(function(r){return trim(r["Service"]);}); DB.catErr=null; }catch(e){ DB.cat=[]; DB.catErr=errMsg(e); }
  try{ var ff=await queryRows(DS_FLOOR); DB.floors=ff.rows.filter(function(r){return trim(r["Offer"]);}); DB.floorsOk=DB.floors.length>0; }catch(e){ DB.floors=[]; DB.floorsOk=false; }
  try{ var cs=await queryRows(DS_CFO), cm=await queryRows(DS_CFOM); DB.cfoSettings=cs.rows.filter(function(r){return trim(r["Report name"]);}); DB.cfoMonths=cm.rows; DB.cfoErr=null; }catch(e){ DB.cfoSettings=[]; DB.cfoMonths=[]; DB.cfoErr=errMsg(e); }
  DB.clients=a.rows.filter(function(r){return trim(r["Legal name"]);});
  DB.engs=b.rows.filter(function(r){return trim(r["Engagement"]);});
  DB.more=a.more||b.more; DB.loaded=true; DB.err=null; DB.errCode=null; DB.at=new Date();
  setPill("ok","Notion connected \u00b7 "+DB.clients.length+" clients");
 }catch(e){
  if(e&&e.retryable&&!isRetry){ setTimeout(function(){loadData(true);}, (e.retryAfterMs||1500)+Math.random()*800); return; }
  DB.err=errMsg(e); DB.errCode=e&&e.code; setPill("bad","Notion: action needed");
 }
 refreshAll();
}

var STEPPERS={};
function makeStepper(key, col, steps){
 if(!col || STEPPERS[key]) return;
 col.classList.add("stepped");
 var head=document.createElement("div"); head.className="stepper"; head.setAttribute("role","tablist");
 var body=document.createElement("div"); body.className="stepbody";
 col.insertBefore(body, col.firstChild); col.insertBefore(head, body);
 var S={cur:0, steps:steps, head:head, wraps:[]};
 steps.forEach(function(st,i){
  var b=document.createElement("button"); b.type="button"; b.className="st"; b.setAttribute("role","tab");
  b.innerHTML='<span class="dot">'+(i+1)+'</span><span class="lab">'+esc(st.label)+'</span>'; b.onclick=function(){ stepGo(key,i); }; head.appendChild(b);
  var w=document.createElement("div"); w.className="stepwrap"; st.els.forEach(function(e){ if(e) w.appendChild(e); });
  var nav=document.createElement("div"); nav.className="stepnav";
  nav.innerHTML=(i>0?'<button class="btn sec" type="button" data-back="1">Back</button>':'<span></span>')+'<span class="pos">Step '+(i+1)+' of '+steps.length+'</span>'+(i<steps.length-1?'<button class="btn" type="button" data-next="1">Next: '+esc(steps[i+1].label)+'</button>':'<span class="pos">Last step. Review the letter below, then download.</span>');
  w.appendChild(nav); body.appendChild(w); S.wraps.push(w);
  var bk=nav.querySelector("[data-back]"), nx=nav.querySelector("[data-next]"); if(bk) bk.onclick=function(){ stepGo(key,i-1); }; if(nx) nx.onclick=function(){ stepGo(key,i+1); };
 });
 STEPPERS[key]=S; stepGo(key,0);
}
function stepGo(key,i){ var S=STEPPERS[key]; if(!S) return; S.cur=Math.max(0,Math.min(S.steps.length-1,i)); S.wraps.forEach(function(w,j){ w.style.display=j===S.cur?"":"none"; }); stepMarks(key); var col=S.head.parentNode; if(col) col.scrollTop=0; }
function stepMarks(key){ var S=STEPPERS[key]; if(!S) return; Array.prototype.forEach.call(S.head.children,function(b,j){ var st=S.steps[j], done=false; try{ done=st.done?!!st.done():false; }catch(e){} b.classList.toggle("cur",j===S.cur); b.classList.toggle("done",done&&j!==S.cur); b.querySelector(".dot").textContent = (done&&j!==S.cur)?"\u2713":String(j+1); b.setAttribute("aria-selected",j===S.cur?"true":"false"); }); }
